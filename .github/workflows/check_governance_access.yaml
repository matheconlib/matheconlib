name: Check governance monitor service access

on:
  push:
    branches: [codex/governance-email-alerts]
    paths:
      - infrastructure/governance-alerts/**
      - .github/workflows/check_governance_access.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: infrastructure/governance-alerts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --test
      - name: Check read-only GitHub visibility and existing Cloudflare connection
        env:
          GITHUB_READ_TOKEN: ${{ secrets.GOVERNANCE_READ_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_MATHECON_PASS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_MATHECON_ACCT }}
        run: node scripts/service-access.mjs
