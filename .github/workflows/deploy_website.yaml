name: Deploy MathEconLib PR 108 preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matheconlib-pr108-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the website
        run: npm run build

      - name: Keep the review preview out of search indexes
        run: |
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > _site/_headers

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.130.0
          workingDirectory: website
          command: deploy --name matheconlib-pr108 --message "PR 108 preview at 31bad5b"
