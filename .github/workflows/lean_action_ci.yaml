name: Lean Action CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - ".github/workflows/deploy_website.yaml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "website/**"
      - ".github/workflows/deploy_website.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Same-repo PRs: check out the head branch so the convenience push below
          # can commit back to it. Fork PRs and pushes: default checkout, which for
          # a PR is the merge ref - i.e. the contributor's code merged onto main.
          ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && github.event.pull_request.head.ref || '' }}
      - name: Check copyright headers
        run: bash scripts/check-headers.sh
      - name: Test import regeneration helper
        run: python3 scripts/tests/test_update_imports.py
      - name: Cache project build artifacts
        uses: actions/cache@v5
        with:
          # Mathlib has its own cache. Archiving all of .lake duplicates its large
          # dependency build and can exhaust runner disk space during cache save.
          path: .lake/build
          # Use a separate namespace so old whole-.lake archives are not restored.
          key: lake-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      - name: Set up Lean and Mathlib
        uses: leanprover/lean-action@v1
        with:
          # Prepare the toolchain and dependencies; generate imports before building.
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
          mk_all-check: false
      - name: Regenerate import lists (same-repo PRs only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          bash scripts/update-imports.sh
      - name: Check import lists (fork PRs and pushes)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if ! bash scripts/update-imports.sh --check; then
            echo "::error::Import-list verification failed. Run locally: bash scripts/update-imports.sh, then commit MathEconLib.lean and MathEconLibTest.lean."
            exit 1
          fi
      - name: Build library, API pins, and namespace tests
        run: lake build
      - name: Commit verified import lists (same-repo PRs only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add MathEconLib.lean MathEconLibTest.lean
          if git diff --staged --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Run mk_all: update imports"
          git push
