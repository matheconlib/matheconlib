name: Lean Action CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  matching-imports:
    name: Check matching imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          mk_all-check: true
          mk_all-args: "--lib MatchingTheory --git"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          # Use WORKFLOW_PAT so bot pushes trigger a new CI run (GITHUB_TOKEN pushes do not).
          token: ${{ secrets.WORKFLOW_PAT || secrets.GITHUB_TOKEN }}
      - uses: leanprover/lean-action@v1
        with:
          mk_all-check: false
      - name: Run mk_all and push if changed
        if: github.event_name == 'pull_request'
        run: |
          lake exe mk_all --lib Auctionlib || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Run mk_all: update imports"
          git push