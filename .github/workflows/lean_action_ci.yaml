name: Lean Action CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # A newer push to a PR supersedes its in-progress run
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Same-repo PRs: check out the head branch so the convenience push below
          # can commit back to it. Fork PRs and pushes: default checkout, which for
          # a PR is the merge ref - i.e. the contributor's code merged onto main.
          ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && github.event.pull_request.head.ref || '' }}
      - name: Check copyright headers
        run: bash scripts/check-headers.sh
      - name: Test import regeneration helper
        run: python3 scripts/tests/test_update_imports.py
      - name: Test warning reporting helper
        run: node --test scripts/tests/test_warning_counts.cjs
      - name: Cache project build artifacts
        uses: actions/cache@v5
        with:
          # Mathlib has its own cache. Archiving all of .lake duplicates its large
          # dependency build and can exhaust runner disk space during cache save.
          path: .lake/build
          # Use a separate namespace so old whole-.lake archives are not restored.
          # The docs job restores this exact key.
          key: lake-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      - name: Set up Lean and Mathlib
        uses: leanprover/lean-action@v1
        with:
          # Prepare the toolchain and dependencies; generate imports before building.
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
          mk_all-check: false
      - name: Regenerate import lists (same-repo PRs only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          bash scripts/update-imports.sh
      - name: Check import lists (fork PRs and pushes)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if ! bash scripts/update-imports.sh --check; then
            echo "::error::Import-list verification failed. Run locally: bash scripts/update-imports.sh, then commit MathEconLib.lean and MathEconLibTest.lean."
            exit 1
          fi
      - name: Build library, API pins, and namespace tests
        id: lean_build
        run: |
          mkdir -p "$RUNNER_TEMP/library-warnings"
          set -o pipefail
          lake --rehash --no-ansi build 2>&1 | tee "$RUNNER_TEMP/library-warnings/build.log"
      - name: Commit verified import lists (same-repo PRs only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add MathEconLib.lean MathEconLibTest.lean
          if git diff --staged --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Run mk_all: update imports"
          git push
      - name: Record built revision
        id: revision
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test proof integrity checker
        run: python3 scripts/tests/test_proof_integrity.py
      - name: Check project proof integrity
        id: proof_integrity
        run: python3 scripts/check-proof-integrity.py --report "$RUNNER_TEMP/proof-integrity/report.json"
      - name: Save proof integrity report
        if: always() && !cancelled() && steps.proof_integrity.outcome != '' && steps.proof_integrity.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: proof-integrity
          path: ${{ runner.temp }}/proof-integrity/report.json
          if-no-files-found: error
          retention-days: 90
      # Record after the convenience commit so counts follow the verified code
      # even when CI has advanced the PR head by committing regenerated imports.
      - name: Record library warning counts
        if: always() && !cancelled()
        env:
          BUILD_OUTCOME: ${{ steps.lean_build.outcome }}
          REPORT_DIRECTORY: ${{ runner.temp }}/library-warnings
        run: node scripts/warning-counts.cjs
      - name: Save library warning counts
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: library-warning-counts
          path: ${{ runner.temp }}/library-warnings/snapshot.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  # Advisory: documentation and publication failures are reported here without
  # failing the library build. Keep this job out of required checks.
  docs:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      # Serialize main publication so pruning never races another upload.
      group: ${{ github.ref == 'refs/heads/main' && 'docs-publish-main' || format('docs-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          # The commit the build job verified, including any import-list commit.
          ref: ${{ needs.build.outputs.revision }}
      - name: Test documentation helpers
        run: python3 -m unittest discover -s scripts/tests -p 'test_*docs.py'
      - name: Test signature extractor
        run: python3 scripts/tests/test_extract_signatures.py
      - name: Restore project build artifacts
        uses: actions/cache/restore@v5
        with:
          # Saved by the build job; on a miss, Lake rebuilds the project.
          path: .lake/build
          key: lake-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
      - name: Set up Lean and Mathlib
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
          mk_all-check: false
      - name: Identify documentation cache
        id: doc-cache
        run: |
          # The doc-gen4 release matching lean-toolchain, resolved to its current commit.
          python3 -c 'import sys; from pathlib import Path; sys.path.insert(0, "scripts"); import build_docs as d; print("revision=" + d.resolve_docgen(d.docgen_release(Path("."))))' >> "$GITHUB_OUTPUT"
      - name: Restore dependency documentation cache
        id: restore-doc-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/doc-cache
          key: docs-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ steps.doc-cache.outputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: docs-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ steps.doc-cache.outputs.revision }}-
      - name: Build and export API documentation
        env:
          DOCGEN_SRC: github
        run: python3 scripts/build_docs.py --output-dir "$RUNNER_TEMP/doc-artifacts" --cache-dir "$RUNNER_TEMP/doc-cache"
      - name: Save dependency documentation cache
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/doc-cache
          key: ${{ steps.restore-doc-cache.outputs.cache-primary-key }}
      - name: Extract signature index
        run: python3 scripts/extract_signatures.py --no-build --db "$RUNNER_TEMP/doc-artifacts/api-docs.db" --output "$RUNNER_TEMP/doc-artifacts/doc/signatures"
      - name: Upload API documentation
        uses: actions/upload-artifact@v7
        with:
          name: api-docs
          path: ${{ runner.temp }}/doc-artifacts/doc
          if-no-files-found: error
      - name: Upload documentation database and provenance
        uses: actions/upload-artifact@v7
        with:
          name: api-docs-database
          path: |
            ${{ runner.temp }}/doc-artifacts/api-docs.db.gz
            ${{ runner.temp }}/doc-artifacts/metadata.json
            ${{ runner.temp }}/doc-artifacts/lake-manifest.json
          compression-level: 0
          if-no-files-found: error
      - name: Upload signature index
        uses: actions/upload-artifact@v7
        with:
          name: signature-index
          path: ${{ runner.temp }}/doc-artifacts/doc/signatures
          if-no-files-found: error
      - name: Publish documentation database and HTML to R2
        if: github.repository == 'matheconlib/matheconlib' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash scripts/upload-docs.sh "$RUNNER_TEMP/doc-artifacts"
      - name: Remove temporary documentation outputs
        if: always()
        run: rm -rf "$RUNNER_TEMP/doc-artifacts" "$RUNNER_TEMP/doc-cache"
