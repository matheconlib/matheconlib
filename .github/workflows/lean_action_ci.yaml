name: Lean Action CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - ".github/workflows/deploy_website.yaml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "website/**"
      - ".github/workflows/deploy_website.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Same-repo PRs: check out the head branch so the convenience push below
          # can commit back to it. Fork PRs and pushes: default checkout, which for
          # a PR is the merge ref - i.e. the contributor's code merged onto main.
          ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && github.event.pull_request.head.ref || '' }}
      - uses: leanprover/lean-action@v1
        with:
          mk_all-check: false
      - name: Regenerate import lists and push (same-repo PRs only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          lake exe mk_all --lib MathEconLib --git
          lake exe mk_all --lib MathEconLibTest --git
          # Check newly imported declarations before committing regenerated roots.
          lake build MathEconLibTest.Namespace
          git add MathEconLib.lean MathEconLibTest.lean
          if git diff --staged --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Run mk_all: update imports"
          git push
      - name: Check import lists (fork PRs and pushes)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if ! (lake exe mk_all --lib MathEconLib --git --check && lake exe mk_all --lib MathEconLibTest --git --check); then
            echo "::error::Generated import lists are out of date. Run locally: lake exe mk_all --lib MathEconLib --git && lake exe mk_all --lib MathEconLibTest --git, then commit the two root .lean files."
            exit 1
          fi
