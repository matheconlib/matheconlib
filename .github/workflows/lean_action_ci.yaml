name: Lean Action CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - ".github/workflows/deploy_website.yaml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "website/**"
      - ".github/workflows/deploy_website.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Same-repo PRs: check out the head branch so the convenience push below
          # can commit back to it. Fork PRs and pushes: default checkout, which for
          # a PR is the merge ref - i.e. the contributor's code merged onto main.
          ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && github.event.pull_request.head.ref || '' }}
      - name: Test import regeneration helper
        run: python3 scripts/tests/test_update_imports.py
      - uses: leanprover/lean-action@v1
        with:
          mk_all-check: false
      - name: Regenerate import lists and push (same-repo PRs only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          bash scripts/update-imports.sh
          git add Auctionlib.lean AuctionlibTest.lean
          if git diff --staged --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Run mk_all: update imports"
          git push
      - name: Check import lists (fork PRs and pushes)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if ! bash scripts/update-imports.sh --check; then
            echo "::error::Import-list verification failed. Run locally: bash scripts/update-imports.sh, then commit Auctionlib.lean and AuctionlibTest.lean."
            exit 1
          fi
