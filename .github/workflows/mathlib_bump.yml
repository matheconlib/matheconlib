name: Mathlib version bump

# Weekly (and on demand): if Mathlib has a newer stable release than our pin,
# run scripts/mathlib_bump.sh and open a PR with the verified bump.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: "Mathlib tag to bump to (default: latest stable vX.Y.Z)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mathlib-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          # A PAT here lets the pushed branch and PR trigger Lean Action CI.
          token: ${{ secrets.MATHLIB_BUMP_TOKEN || github.token }}
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Bump, build, and check
        id: bump
        env:
          TARGET: ${{ inputs.target }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          args=(--log-dir "$RUNNER_TEMP/mathlib-bump")
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          bash scripts/mathlib_bump.sh "${args[@]}"
      - name: Save bump logs
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: mathlib-bump-logs
          path: ${{ runner.temp }}/mathlib-bump
          if-no-files-found: ignore
          retention-days: 30
      # The only step that writes to GitHub. It runs only on GitHub-hosted Actions
      # (never under `act` or a local shell), and is a no-op if the branch or PR
      # already exists. PRs opened with GITHUB_TOKEN do not trigger other
      # workflows; set the MATHLIB_BUMP_TOKEN secret (a fine-grained PAT) so that
      # Lean Action CI runs on the bump PR.
      - name: Open bump PR
        if: steps.bump.outputs.result == 'bumped'
        env:
          GH_TOKEN: ${{ secrets.MATHLIB_BUMP_TOKEN || github.token }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          CURRENT: ${{ steps.bump.outputs.current }}
          TARGET: ${{ steps.bump.outputs.target }}
          TOOLCHAIN: ${{ steps.bump.outputs.toolchain }}
        run: |
          if [ "${GITHUB_ACTIONS:-}" != "true" ] || [ -n "${ACT:-}" ]; then
            echo "Not running on GitHub Actions; not pushing or opening a PR."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "Branch $BRANCH already exists on origin; leaving it alone."
            exit 0
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: bump Mathlib to $TARGET" \
            --body "$(cat <<EOF
          Automated bump: Mathlib \`$CURRENT\` → \`$TARGET\`, Lean \`$TOOLCHAIN\`.

          Generated by \`scripts/mathlib_bump.sh\` in [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).
          \`lake build\`, the Lean Action CI checks, the proof-integrity (axiom) audit, and the
          BIC audits passed on the bumped toolchain; logs are attached to the run as
          \`mathlib-bump-logs\`. Review new warnings under the warning policy before merging.
          EOF
          )"
