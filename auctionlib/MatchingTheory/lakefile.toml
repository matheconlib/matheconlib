# Pinned to the mathlib v4.31.0 release for a consistent snapshot with
# lean-toolchain. To move to mathlib master, see README "Updating mathlib".
name = "matching"
version = "0.4.0"
defaultTargets = ["Matching"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.31.0"

[[lean_lib]]
name = "Matching"
