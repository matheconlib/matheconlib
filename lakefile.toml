name = "auctionlib"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Auctionlib", "ApiStability", "AuctionlibTest"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
autoImplicit = false
weak.mathlibStandardSet = true
maxSynthPendingDepth = 3
linter.style.longLine = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.28.0"

[[lean_lib]]
name = "Auctionlib"

[[lean_lib]]
name = "ApiStability"

[[lean_lib]]
name = "AuctionlibTest"
