name = "auctionlib"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Auctionlib"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
autoImplicit = false
weak.mathlibStandardSet = true
maxSynthPendingDepth = 3
linter.style.longLine = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0-rc2"

[[lean_lib]]
name = "Auctionlib"
