name = "matheconlib"
version = "0.1.0"
keywords = ["math"]
description = "Machine-checked mathematical economics in Lean 4"
license = "Apache-2.0"
licenseFiles = ["LICENSE"]
defaultTargets = ["MathEconLib", "ApiStability", "MathEconLibTest", "MathEconLibExamples"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
autoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
linter.style.longLine = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.28.0"

[[lean_lib]]
name = "MathEconLib"

[[lean_lib]]
name = "ApiStability"

[[lean_lib]]
name = "MathEconLibTest"

[[lean_lib]]
name = "MathEconLibExamples"
